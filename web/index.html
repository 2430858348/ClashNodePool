<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClashNodePool · 节点池订阅</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/favicon.ico?v=2">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --card2:#fbfbfd; --bd:#e6e8ec; --bd2:#d5d8de;
  --tx:#14171c; --tx2:#636b78; --tx3:#8d95a1;
  --acc:#2f6df6; --acc-soft:#eaf1fe;
  --ok:#0f9d6e; --ok-soft:#e6f7f1;
  --warn:#c27c0e; --warn-soft:#fdf3e2;
  --err:#d6483f; --err-soft:#fdeceb;
  --r:14px;
}
[data-theme="dark"]{
  --bg:#0e1014; --card:#161a21; --card2:#1b2028; --bd:#262d38; --bd2:#333c4a;
  --tx:#e9ecf1; --tx2:#98a1ae; --tx3:#6e7885;
  --acc:#5b8ef8; --acc-soft:#1c2740;
  --ok:#3ec99b; --ok-soft:#12302a;
  --warn:#e0a340; --warn-soft:#33280f;
  --err:#f0736a; --err-soft:#3a1d1c;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:13.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;
}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--tx3)}
.spacer{flex:1}

.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card); border:1px solid var(--bd);
  border-radius:999px; padding:5px 12px; font-size:12px; color:var(--tx2);
}
.pill b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}

button{
  font:inherit; cursor:pointer; border-radius:10px;
  border:1px solid var(--bd2); background:var(--card); color:var(--tx);
  padding:7px 14px; transition:transform .12s cubic-bezier(.16,1,.3,1),background .15s,border-color .15s;
}
button:hover:not(:disabled){background:var(--card2);border-color:var(--tx3);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0) scale(.99)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover:not(:disabled){background:var(--acc);filter:brightness(1.07)}
button.ghost{border-color:transparent;background:transparent;color:var(--tx2);padding:5px 9px}
button.ghost:hover:not(:disabled){background:var(--card2);border-color:var(--bd)}
button.danger{color:var(--err);border-color:var(--bd2)}
button.danger:hover:not(:disabled){background:var(--err-soft);border-color:var(--err)}
button.sm{padding:4px 10px;font-size:12px;border-radius:8px}

.card{
  background:var(--card); border:1px solid var(--bd); border-radius:var(--r);
  margin-bottom:18px; overflow:hidden;
}
.card > .hd{
  display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--bd);
}
.card > .hd h2{font-size:13.5px;font-weight:600;margin:0}
.card > .hd .note{font-size:12px;color:var(--tx3)}
.card > .bd{padding:16px 18px}
.card > .bd.flush{padding:0}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:left; font-weight:500; color:var(--tx3); font-size:11.5px;
  padding:9px 14px; border-bottom:1px solid var(--bd); white-space:nowrap;
  background:var(--card2); position:sticky; top:0;
}
td{padding:9px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--card2)}
.tbl-scroll{max-height:420px;overflow:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px}
.num{font-variant-numeric:tabular-nums}

.tag{
  display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  border:1px solid var(--bd2);color:var(--tx2);background:var(--card2);white-space:nowrap;
}
.tag.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.tag.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tag.err{color:var(--err);background:var(--err-soft);border-color:transparent}
.tag.acc{color:var(--acc);background:var(--acc-soft);border-color:transparent}

.token{
  display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--bd);flex-wrap:wrap;
}
.token:last-child{border-bottom:none}
.token .info{min-width:200px;flex:1}
.token .label{font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.token .url{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;color:var(--tx3);word-break:break-all;
}
.token .cd{font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;min-width:118px;text-align:right}
.token .cd small{display:block;font-size:11px;color:var(--tx3);font-weight:400}
.token .acts{display:flex;gap:6px;flex-wrap:wrap}

.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;background:var(--card2);border-top:1px solid var(--bd)}
input,select{
  font:inherit;padding:7px 11px;border-radius:9px;
  border:1px solid var(--bd2);background:var(--card);color:var(--tx);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=text]{min-width:170px}

.empty{padding:34px 18px;text-align:center;color:var(--tx3);font-size:12.5px}
.logline{display:flex;gap:10px;padding:7px 18px;border-bottom:1px solid var(--bd);font-size:12px;align-items:baseline}
.logline:last-child{border-bottom:none}
.logline .t{color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11px}
.logline .p{color:var(--tx3);min-width:52px;font-size:11px}
.logline .m{flex:1;word-break:break-word}
.logline .s{color:var(--tx3);font-size:11px;white-space:nowrap}
.logs{max-height:340px;overflow:auto}

.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--ok)}
.dot.busy{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.hint{font-size:11.5px;color:var(--tx3);line-height:1.7}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:10px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:720px){
  .token .cd{text-align:left;min-width:0}
  table{font-size:11.5px}
  th,td{padding:8px 10px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <h1>ClashNodePool</h1>
    <span>localhost:8787</span>
  </div>
  <div class="spacer"></div>
  <div class="pills">
    <div class="pill"><span class="dot" id="live"></span><span>存活 <b id="p-alive">–</b></span></div>
    <div class="pill">源 <b id="p-src">–</b></div>
    <div class="pill">上轮 <b id="p-last">–</b></div>
  </div>
  <button id="btn-refresh" class="primary">立即刷新</button>
  <button id="btn-theme" class="ghost" title="切换主题">◐</button>
</header>

<section class="card">
  <div class="hd">
    <h2>订阅令牌</h2>
    <span class="note">把链接填进 Clash 的「订阅」里，过期后 Clash 拉取会被拒绝（不会清空你现有节点）</span>
  </div>
  <div id="token-list" class="bd flush"></div>
  <div class="form">
    <input id="tk-label" type="text" placeholder="备注，例如：本机 Clash">
    <select id="tk-ttl">
      <option value="1">1 小时</option>
      <option value="24">1 天</option>
      <option value="72">3 天</option>
      <option value="168" selected>7 天</option>
      <option value="720">30 天</option>
      <option value="custom">自定义…</option>
    </select>
    <input id="tk-custom" type="number" min="0.5" step="0.5" placeholder="小时" style="width:100px;display:none">
    <button class="primary" id="btn-new-token">签发新订阅</button>
  </div>
</section>

<section class="card">
  <div class="hd">
    <h2>节点池</h2>
    <span class="note" id="node-note"></span>
    <div class="spacer"></div>
    <input id="node-q" type="text" placeholder="搜索名称 / 服务器 / 类型" style="min-width:200px">
  </div>
  <div class="bd flush">
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>名称</th><th>类型</th><th>服务器</th><th>延迟</th><th>来源</th><th>已存活</th>
        </tr></thead>
        <tbody id="node-body"></tbody>
      </table>
    </div>
    <div id="node-empty" class="empty" style="display:none">池子里还没有节点。点右上角「立即刷新」跑一轮采集。</div>
  </div>
</section>

<section class="card">
  <div class="hd"><h2>源健康度</h2><span class="note">成功率低的源建议关闭，减少无效等待</span></div>
  <div class="bd flush">
    <table>
      <thead><tr>
        <th>源</th><th>状态</th><th>节点数</th><th>成功率</th><th>上次拉取</th><th></th>
      </tr></thead>
      <tbody id="src-body"></tbody>
    </table>
  </div>
</section>

<section class="card">
  <div class="hd"><h2>运行日志</h2><span class="note">最近 200 条</span></div>
  <div id="log-list" class="bd flush logs"></div>
</section>

<div class="hint" style="text-align:center;margin-top:8px">
  仅本机可用（127.0.0.1）。不要把订阅链接公开分享 —— 会被大量拉取，节点 IP 也会被迅速封禁。
</div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var clockSkew = 0, tickTimer = null, lastTokens = [];

  function $(id){ return document.getElementById(id); }
  function esc(v){
    return String(v === null || v === undefined ? "" : v)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function nowSec(){ return Math.floor(Date.now()/1000) + clockSkew; }

  function toast(msg){
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function api(path, opts){
    return fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts || {}))
      .then(function(r){
        return r.text().then(function(txt){
          var data = {};
          if(txt){
            try { data = JSON.parse(txt); }
            catch(e){ data = {detail: txt.slice(0, 200)}; }
          }
          if(!r.ok){
            throw new Error(data.detail || data.reason || ("HTTP " + r.status));
          }
          return data;
        });
      });
  }

  function dur(sec){
    sec = Math.max(0, Math.floor(sec));
    var d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), s = sec%60;
    if(d > 0) return d + "d " + h + "h";
    if(h > 0) return h + "h " + m + "m";
    if(m > 0) return m + "m " + s + "s";
    return s + "s";
  }
  function ago(ts){
    if(!ts) return "—";
    var diff = nowSec() - ts;
    if(diff < 0) return "刚刚";
    return dur(diff) + "前";
  }
  function hhmm(ts){
    if(!ts) return "—";
    var d = new Date(ts*1000);
    var p = function(n){ return n < 10 ? "0" + n : "" + n; };
    return p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function copyText(text){
    if(navigator.clipboard && window.isSecureContext !== false){
      navigator.clipboard.writeText(text).then(function(){ toast("已复制"); }, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("已复制"); } catch(e){ toast("复制失败，请手动选择"); }
      document.body.removeChild(ta);
    }
  }

  function loadStatus(){
    return api("/api/status").then(function(s){
      clockSkew = s.now - Math.floor(Date.now()/1000);
      $("p-alive").textContent = s.pool.alive;
      $("p-src").textContent = s.sources.enabled + "/" + s.sources.total;
      var running = s.pipeline.running;
      $("live").className = "dot" + (running ? " busy" : "");
      $("btn-refresh").disabled = running;
      $("btn-refresh").textContent = running ? "运行中…" : "立即刷新";
      var last = s.pipeline.last_end || s.pipeline.last_start;
      $("p-last").textContent = running ? "运行中" : (last ? ago(last) : "未运行");
      $("node-note").textContent = "可用 " + s.pool.alive + " 条 · UDP " +
        s.pool.alive_udp + " 条（无法用 TCP 验证）· 待测 " + s.pool.pending +
        " 条 · 近 1 小时新增 " + s.pool.new_last_hour;
    }).catch(function(){});
  }

  function loadTokens(){
    return api("/api/tokens").then(function(d){
      lastTokens = d.tokens || [];
      renderTokens();
    }).catch(function(){});
  }

  function renderTokens(){
    var box = $("token-list");
    if(!lastTokens.length){
      box.innerHTML = '<div class="empty">还没有订阅令牌，在下面签发一个。</div>';
      return;
    }
    var html = "";
    lastTokens.forEach(function(t){
      var stateTag = t.state === "active" ? '<span class="tag ok">有效</span>'
        : t.state === "expired" ? '<span class="tag err">已过期</span>'
        : '<span class="tag warn">已吊销</span>';
      html += '<div class="token" data-tk="' + esc(t.token) + '">'
        +   '<div class="info">'
        +     '<div class="label">' + esc(t.label || "未命名") + stateTag
        +       '<span class="tag">拉取 ' + t.fetch_count + ' 次</span></div>'
        +     '<div class="url" data-url="' + esc(t.url) + '">' + esc(t.url) + '</div>'
        +   '</div>'
        +   '<div class="cd" data-exp="' + t.expires_ts + '">—<small>剩余</small></div>'
        +   '<div class="acts">'
        +     '<button class="sm" data-act="copy">复制</button>'
        +     '<button class="sm" data-act="extend7">+7天</button>'
        +     '<button class="sm" data-act="extend30">+30天</button>'
        +     '<button class="sm' + (t.revoked ? '' : ' danger') + '" data-act="revoke">'
        +       (t.revoked ? '恢复' : '吊销') + '</button>'
        +     '<button class="sm danger" data-act="del">删除</button>'
        +   '</div>'
        + '</div>';
    });
    box.innerHTML = html;
    tickCountdowns();
  }

  function tickCountdowns(){
    var nodes = document.querySelectorAll(".cd[data-exp]");
    for(var i=0;i<nodes.length;i++){
      var el = nodes[i];
      var exp = parseInt(el.getAttribute("data-exp"), 10);
      var left = exp - nowSec();
      if(left > 0){ el.innerHTML = dur(left) + '<small>剩余</small>'; }
      else {
        var over = -left;
        el.innerHTML = '<span style="color:var(--err)">' + dur(over) + '前过期</span><small>已失效</small>';
      }
    }
  }

  function loadNodes(){
    var q = $("node-q").value.trim();
    return api("/api/nodes?limit=300&q=" + encodeURIComponent(q)).then(function(d){
      var body = $("node-body"), empty = $("node-empty");
      if(!d.nodes.length){
        body.innerHTML = "";
        empty.style.display = "";
        empty.textContent = q ? "没有匹配的节点。" : "池子里还没有节点。点右上角「立即刷新」跑一轮采集。";
        return;
      }
      empty.style.display = "none";
      var html = "";
      d.nodes.forEach(function(n){
        var lat = n.latency_ms === null || n.latency_ms === undefined
          ? '<span style="color:var(--tx3)">未测</span>'
          : '<span class="num" style="color:' + (n.latency_ms < 200 ? 'var(--ok)' : n.latency_ms < 600 ? 'var(--warn)' : 'var(--err)') + '">' + n.latency_ms + ' ms</span>';
        html += "<tr>"
          + '<td>' + esc(n.name) + '</td>'
          + '<td><span class="tag acc">' + esc(n.type) + '</span></td>'
          + '<td class="mono">' + esc(n.server) + ':' + n.port + '</td>'
          + '<td>' + lat + '</td>'
          + '<td><span class="tag">' + esc(n.source_name || "—") + '</span></td>'
          + '<td class="num" style="color:var(--tx2)">' + dur(nowSec() - n.first_seen) + '</td>'
          + "</tr>";
      });
      body.innerHTML = html;
    }).catch(function(){});
  }

  function loadSources(){
    return api("/api/sources").then(function(d){
      var body = $("src-body");
      if(!d.sources.length){ body.innerHTML = '<tr><td colspan="6" class="empty">没有配置源</td></tr>'; return; }
      var html = "";
      d.sources.forEach(function(s){
        var st = s.last_status || "未拉取";
        var cls = st.indexOf("OK") === 0 ? "ok" : (st === "未拉取" ? "" : "err");
        var rate = s.alive_rate === null ? "—" : s.alive_rate + "%";
        html += "<tr>"
          + '<td><div>' + esc(s.name) + '</div>'
          +   '<div class="mono" style="color:var(--tx3);font-size:10.5px">' + esc(s.url) + '</div></td>'
          + '<td><span class="tag ' + cls + '">' + esc(st) + '</span></td>'
          + '<td class="num">' + s.last_node_count + '</td>'
          + '<td class="num" style="color:' + (s.alive_rate !== null && s.alive_rate < 50 ? "var(--warn)" : "var(--tx2)") + '">' + rate + '</td>'
          + '<td style="color:var(--tx2)">' + hhmm(s.last_fetch_ts) + '</td>'
          + '<td style="text-align:right">'
          +   '<button class="sm" data-sid="' + s.id + '" data-en="' + (s.enabled ? 0 : 1) + '">'
          +     (s.enabled ? "关闭" : "启用") + '</button></td>'
          + "</tr>";
      });
      body.innerHTML = html;
    }).catch(function(){});
  }

  function loadLogs(){
    return api("/api/logs?limit=200").then(function(d){
      var box = $("log-list");
      if(!d.logs.length){ box.innerHTML = '<div class="empty">暂无日志</div>'; return; }
      var html = "";
      d.logs.forEach(function(l){
        var cls = l.level === "error" ? "err" : l.level === "warn" ? "warn" : "ok";
        html += '<div class="logline">'
          + '<span class="t">' + hhmm(l.ts) + '</span>'
          + '<span class="tag ' + cls + '">' + esc(l.level) + '</span>'
          + '<span class="p">' + esc(l.phase) + '</span>'
          + '<span class="m">' + esc(l.message) + '</span>'
          + (l.source ? '<span class="s">' + esc(l.source) + '</span>' : '')
          + '</div>';
      });
      box.innerHTML = html;
    }).catch(function(){});
  }

  function reloadAll(){ loadStatus(); loadTokens(); loadNodes(); loadSources(); loadLogs(); }

  $("btn-refresh").addEventListener("click", function(){
    this.disabled = true;
    api("/api/refresh", {method:"POST"}).then(function(){
      toast("已开始刷新，约 1–2 分钟出结果");
      loadStatus();
    }).catch(function(e){
      toast(e.message || "启动失败");
      loadStatus();
    });
  });

  $("tk-ttl").addEventListener("change", function(){
    $("tk-custom").style.display = this.value === "custom" ? "" : "none";
  });

  $("btn-new-token").addEventListener("click", function(){
    var sel = $("tk-ttl").value;
    var ttl = sel === "custom" ? parseFloat($("tk-custom").value) : parseFloat(sel);
    if(!ttl || ttl <= 0){ toast("请填写有效的小时数"); return; }
    api("/api/tokens", {
      method:"POST",
      body: JSON.stringify({label: $("tk-label").value.trim(), ttl_hours: ttl})
    }).then(function(t){
      $("tk-label").value = "";
      toast("已签发，有效期 " + dur(ttl*3600));
      loadTokens();
      copyText(t.url);
    }).catch(function(e){ toast(e.message); });
  });

  $("token-list").addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-act]");
    if(!btn) return;
    var row = btn.closest(".token");
    var tk = row.getAttribute("data-tk");
    var act = btn.getAttribute("data-act");
    if(act === "copy"){
      copyText(row.querySelector(".url").getAttribute("data-url"));
      return;
    }
    if(act === "extend7" || act === "extend30"){
      var hrs = act === "extend7" ? 168 : 720;
      api("/api/tokens/" + encodeURIComponent(tk), {
        method:"PATCH", body: JSON.stringify({extend_hours: hrs})
      }).then(function(){ toast("已延长 " + (hrs/24) + " 天"); loadTokens(); })
        .catch(function(e){ toast(e.message); });
      return;
    }
    if(act === "revoke"){
      var willRevoke = btn.textContent.trim() === "吊销";
      api("/api/tokens/" + encodeURIComponent(tk), {
        method:"PATCH", body: JSON.stringify({revoked: willRevoke})
      }).then(function(){ toast(willRevoke ? "已吊销" : "已恢复"); loadTokens(); })
        .catch(function(e){ toast(e.message); });
      return;
    }
    if(act === "del"){
      if(!confirm("删除后这个订阅链接立即失效，确定吗？")) return;
      api("/api/tokens/" + encodeURIComponent(tk), {method:"DELETE"})
        .then(function(){ toast("已删除"); loadTokens(); })
        .catch(function(e){ toast(e.message); });
    }
  });

  $("src-body").addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-sid]");
    if(!btn) return;
    var sid = btn.getAttribute("data-sid");
    var en = btn.getAttribute("data-en") === "1";
    api("/api/sources/" + sid, {method:"PATCH", body: JSON.stringify({enabled: en})})
      .then(function(){ toast(en ? "已启用" : "已关闭"); loadSources(); loadStatus(); })
      .catch(function(e){ toast(e.message); });
  });

  var qTimer = null;
  $("node-q").addEventListener("input", function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(loadNodes, 260);
  });

  $("btn-theme").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("np-theme", next); } catch(e){}
  });
  try {
    var saved = localStorage.getItem("np-theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  } catch(e){}

  // ---- 生命周期：活着就报心跳，关页就通知服务退出 ----
  function beat(){
    try {
      fetch("/api/beat", {method:"POST", keepalive:true}).catch(function(){});
    } catch(e){}
  }

  function sayBye(){
    try {
      if(navigator.sendBeacon){
        navigator.sendBeacon("/api/bye");
      } else {
        fetch("/api/bye", {method:"POST", keepalive:true}).catch(function(){});
      }
    } catch(e){}
  }

  beat();
  setInterval(beat, 15000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") beat();
  });
  window.addEventListener("focus", beat);
  window.addEventListener("pagehide", sayBye);
  window.addEventListener("beforeunload", sayBye);

  reloadAll();
  tickTimer = setInterval(tickCountdowns, 1000);
  setInterval(function(){ loadStatus(); loadNodes(); }, 5000);
  setInterval(function(){ loadTokens(); loadSources(); loadLogs(); }, 12000);
})();
</script>
</body>
</html>
